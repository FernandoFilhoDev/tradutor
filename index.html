<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>TRADUTOR</h1>
      <div class="content">
        <div class="divSelects">
          <select class="selectFrom"></select>
          <select class="selectTo"></select>
        </div>
        <div class="divTextaria">
          <textarea
            id="textareaFrom"
            rows="8"
            placeholder="Digitar Texto"
          ></textarea>
          <textarea id="textareaTo" rows="8" placeholder="Tradução"></textarea>
        </div>
        <button id="btnTranslate">TRADUZIR</button>
      </div>
    </div>

    <div class="final">
      <h6>Feito por Fernando!</h6>
    </div>
  </body>
  <script src="script.js"></script>
</html>
